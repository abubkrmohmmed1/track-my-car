<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - TMC</title>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

    <header>
        <div class="container navbar">
            <a href="/index.html" class="logo">
                <span class="logo-badge">TMC</span>
                <div class="logo-text">
                    <span class="logo-title">Track My Car</span>
                    <span class="logo-sub">منظومة استعادة وتتبع المركبات</span>
                </div>
            </a>
            <div class="nav-actions">
                <a href="/index.html" class="btn btn-outline btn-sm">الرئيسية</a>
                <a href="/pages/login.html" class="btn btn-outline btn-sm">تسجيل الدخول</a>
            </div>
        </div>
    </header>

    <main class="container" style="max-width: 520px; margin: 40px auto 60px;">
        <div class="card">
            <h2 style="text-align: center; margin-bottom: 8px; color: var(--primary);">إنشاء حساب جديد</h2>
            <p style="text-align: center; color: var(--gray-600); margin-bottom: 24px; font-size: 0.95rem;">
                سجل حسابك للتمكن من تقديم البلاغات ومتابعة الإشعارات ونتائج المطابقة
            </p>

            <div id="alert-box" style="display: none;" class="alert"></div>

            <form id="register-form" onsubmit="event.preventDefault(); submitRegister();">
                <div class="form-group">
                    <label for="full_name">الاسم الكامل (ثلاثي أو رباعي) *</label>
                    <input type="text" id="full_name" class="form-control" placeholder="مثال: أحمد عبد الله عمر" required>
                </div>
                <div class="form-group">
                    <label for="phone_number">رقم الهاتف (للتواصل في حال التطابق) *</label>
                    <input type="tel" id="phone_number" class="form-control" placeholder="مثال: 0912345678" required>
                </div>
                <div class="form-group">
                    <label for="email">البريد الإلكتروني *</label>
                    <input type="email" id="email" class="form-control" placeholder="name@example.com" required>
                </div>
                <div class="form-group">
                    <label for="password">كلمة المرور *</label>
                    <input type="password" id="password" class="form-control" placeholder="لا تقل عن 6 أحرف" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="confirm_password">تأكيد كلمة المرور *</label>
                    <input type="password" id="confirm_password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" id="btn-submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                    تسجيل الحساب
                </button>
            </form>

            <div style="margin-top: 20px; text-align: center; font-size: 0.9rem;">
                لديك حساب بالفعل؟ <a href="/pages/login.html" style="font-weight: 700;">تسجيل الدخول</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>© 2026 نظام Track My Car (TMC)</p>
        </div>
    </footer>

    <script src="/assets/js/api.js"></script>
    <script>
        async function submitRegister() {
            const fullName = document.getElementById('full_name').value.trim();
            const phoneNumber = document.getElementById('phone_number').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm_password').value;
            const alertBox = document.getElementById('alert-box');
            const submitBtn = document.getElementById('btn-submit');

            if (password !== confirmPassword) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'كلمتا المرور غير متطابقتين!';
                alertBox.style.display = 'block';
                return;
            }

            alertBox.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري إنشاء الحساب...';

            const res = await API.register(fullName, phoneNumber, email, password);

            if (res.success) {
                alertBox.className = 'alert alert-success';
                alertBox.textContent = res.message + '، جاري توجيهك...';
                alertBox.style.display = 'block';

                setTimeout(() => {
                    window.location.href = '/pages/my_reports.html';
                }, 1000);
            } else {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = res.error || 'تعذر إنشاء الحساب';
                alertBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'تسجيل الحساب';
            }
        }
    </script>
</body>
</html>
